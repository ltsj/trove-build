name: Release Trove

on:
  # 私有仓 ltsj/trove 每次 push main 都会用 `gh workflow run` 带 commit 触发。
  # 不再按版本号轮询：每次 push 出一个带短 SHA 后缀的独立 Release。
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full SHA of the ltsj/trove commit to build (blank = current main HEAD)'
        required: false
        type: string

permissions: {}

concurrency:
  group: trove-release-${{ github.event.repository.name || 'scheduled' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'ltsj/trove-build' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.version.outputs.ready }}
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      short: ${{ steps.version.outputs.short }}
      tag: ${{ steps.version.outputs.tag }}
      flutter: ${{ steps.version.outputs.flutter }}
    steps:
      - name: Validate requested commit
        shell: pwsh
        env:
          REQUESTED: ${{ inputs.commit || '' }}
        run: |
          if ($env:REQUESTED -and $env:REQUESTED -cnotmatch '\A[0-9a-f]{40}\z') {
            throw 'Input commit must be a full 40-character SHA.'
          }

      - name: Check out private main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ltsj/trove
          ref: ${{ inputs.commit || 'refs/heads/main' }}
          ssh-key: ${{ secrets.TROVE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          show-progress: false

      - name: Read version and tag
        id: version
        shell: pwsh
        env:
          REQUESTED: ${{ inputs.commit || '' }}
        run: |
          $pattern = '(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)'
          $declared = @(Select-String -LiteralPath pubspec.yaml -Pattern '^version:')
          if ($declared.Count -ne 1 -or $declared[0].Line -cnotmatch "\Aversion:[ \t]*($pattern)[ \t]*\z") {
            throw 'pubspec.yaml must declare one plain MAJOR.MINOR.PATCH version.'
          }
          $version = [version]$Matches[1]
          $code = [long]$version.Major * 10000 + $version.Minor * 100 + $version.Build
          if ($code -gt 2099999999) { throw 'Android versionCode out of range.' }
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -cnotmatch '\A[0-9a-f]{40}\z') {
            throw 'Could not resolve the checked-out source commit.'
          }
          if ($env:REQUESTED -and $env:REQUESTED -ne $commit) {
            throw "Checked out $commit but $($env:REQUESTED) was requested."
          }
          $short = $commit.Substring(0, 7)
          $tag = "v$($version)-g$($short)"
          # 同一 commit 只发一次：重放 dispatch 直接跳过，绝不覆盖 Release。
          $tags = git ls-remote --tags --refs https://github.com/ltsj/trove-build.git
          if ($LASTEXITCODE -ne 0) { throw 'Could not read public release tags.' }
          if ($tags -match "\trefs/tags/$([regex]::Escape($tag))\z") {
            Write-Host "Release for $commit already exists ($tag); nothing to build."
            return
          }
          "ready=true" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "code=$code" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $flutterVersion = (Get-Content -LiteralPath .flutter-version -Raw).Trim()
          if ($flutterVersion -notmatch '\A[0-9]+\.[0-9]+\.[0-9]+\z') { throw 'Invalid Flutter SDK pin.' }
          "flutter=$flutterVersion" >> $env:GITHUB_OUTPUT

  windows:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out private main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ltsj/trove
          ref: ${{ needs.prepare.outputs.commit }}
          ssh-key: ${{ secrets.TROVE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          show-progress: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ needs.prepare.outputs.flutter }}
          channel: stable
          cache: true
          pub-cache-path: ${{ github.workspace }}\.pub-cache

      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --no-pub

      - name: Stage Windows package
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHORT: ${{ needs.prepare.outputs.short }}
        run: |
          New-Item -ItemType Directory release-inputs | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "release-inputs/Trove-$($env:VERSION)-g$($env:SHORT)-windows-x64.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: release-inputs/Trove-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  android:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out private main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ltsj/trove
          ref: ${{ needs.prepare.outputs.commit }}
          ssh-key: ${{ secrets.TROVE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 Gradle User Home（依赖 + 编译脚本 + build-cache-1），R8/JavaCompile 可 FROM-CACHE。
      # 源码 gradle.properties 已开 org.gradle.caching=true。
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ needs.prepare.outputs.flutter }}
          channel: stable
          cache: true
          pub-cache-path: ${{ github.workspace }}/.pub-cache

      # NDK 29 已预装 ubuntu 镜像；Gradle 缓存由 CI 的 setup-gradle 负责。

      - run: flutter pub get --enforce-lockfile

      - name: Build unsigned Android arm64 release
        env:
          TROVE_UNSIGNED_RELEASE: 'true'
        run: flutter build apk --release --no-pub --target-platform android-arm64

      - name: Stage Android package
        shell: pwsh
        run: |
          New-Item -ItemType Directory release-inputs | Out-Null
          Copy-Item 'build/app/outputs/flutter-apk/app-release.apk' release-inputs/app-unsigned.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-unsigned
          path: release-inputs/app-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, windows, android]
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-unsigned
          path: incoming

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64
          path: incoming

      - name: Sign APK and verify package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.code }}
          SHORT: ${{ needs.prepare.outputs.short }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing release keystore}" "${STORE_PASSWORD:?Missing keystore password}" \
            "${KEY_ALIAS:?Missing key alias}" "${KEY_PASSWORD:?Missing key password}" \
            "${EXPECTED_CERT_SHA256:?Missing pinned certificate fingerprint}"
          tools=$(find "${ANDROID_HOME:?}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$tools/apksigner" && test -x "$tools/aapt"
          umask 077
          keystore=$(mktemp)
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p dist
          apk="dist/Trove-$VERSION-g$SHORT-android-arm64.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$apk" incoming/app-unsigned.apk
          cert=$("$tools/apksigner" verify --print-certs "$apk")
          # Newer build-tools report the signer by scheme instead of by number.
          actual=$(sed -nE 's/^(Signer #[0-9]+ |V[0-9]+(\.[0-9]+)? Signer: )certificate SHA-256 digest: ([[:xdigit:]]{64})$/\3/p' <<< "$cert")
          if [[ ! "$actual" =~ ^[[:xdigit:]]{64}$ || "${actual,,}" != "${EXPECTED_CERT_SHA256,,}" ]]; then
            echo 'APK must have exactly one reported signer matching the release certificate.' >&2
            exit 1
          fi
          metadata=$("$tools/aapt" dump badging "$apk")
          grep -Fq "package: name='com.trove.app' versionCode='$VERSION_CODE' versionName='$VERSION'" <<< "$metadata"
          grep -Fxq "native-code: 'arm64-v8a'" <<< "$(sed -n '/^native-code:/s/[[:space:]]*$//p' <<< "$metadata")"
          mv "incoming/Trove-$VERSION-g$SHORT-windows-x64.zip" dist/
          (cd dist && sha256sum ./*.apk ./*.zip | sed 's/  \.\//  /' > SHA256SUMS.txt)

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHORT: ${{ needs.prepare.outputs.short }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if git ls-remote --exit-code "https://github.com/$GH_REPO.git" "refs/tags/$TAG"; then
            echo "Public tag $TAG already exists; refusing to reuse it." >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
          printf "Trove %s for Windows x64 and Android arm64.\n\nSource commit: \`%s\`\nRelease tag: \`%s\`\n" \
            "$VERSION" "$SOURCE_COMMIT" "$TAG" > release-notes.md
          gh release create "$TAG" dist/Trove-*.zip dist/Trove-*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Trove $VERSION (g$SHORT)" --notes-file release-notes.md